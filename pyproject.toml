[project]
name = "heprefs"
version = "0.2.0"
description = "A commandline helper tool for high-energy physics referencing."
authors = [
    { name = "Sho Iwamoto (Misho)", email = "webmaster@misho-web.com" },
]
license = "MIT"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.5,<9",
    "arxiv>=4.0,<5",
    "feedparser>=6.0,<7",
]

[project.urls]
repository = "https://github.com/misho104/heprefs"

[project.scripts]
heprefs = "heprefs.heprefs:heprefs_main"

[dependency-groups]
dev = [
    "mypy>=2.3",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # flake8相当 + isort + bugbear + pyupgrade
