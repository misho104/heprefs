[project]
name = "heprefs"
version = "0.1.5"
description = "A commandline helper tool for high-energy physics referencing."
authors = [
    { name = "Sho Iwamoto (Misho)", email = "webmaster@misho-web.com" },
]
license = "MIT"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0,<9",
    "arxiv>=2.0,<3",
    "feedparser>=6.0,<7",
]

[project.urls]
repository = "https://github.com/misho104/heprefs"

[project.scripts]
heprefs = "heprefs.heprefs:heprefs_main"

[dependency-groups]
dev = [
    "mypy>=1.0",
    "flake8>=7.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
